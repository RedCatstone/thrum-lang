[workspace]
members = ["thrum-engine"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
license-file = "LICENSE"
version = "0.1.0"
repository = "https://github.com/RedCatstone/thrum-lang"
categories = ["compilers"]


[workspace.lints.clippy]
# --- Groups ---
all = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }

# --- Specific Allows ---
missing_panics_doc = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"  # i am like 4x over clippies limits OOOPSS lol
derive_partial_eq_without_eq = "allow"  # don't care
equatable_if_let = "allow"  # disagree, i think pattern matching is cleaner
new_without_default = "allow"  # this lint is more meant for library code i think
single_match_else = "allow"  # this lint is literally jsut annoying.